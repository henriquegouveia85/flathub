app-id: com.github.henriquegouveia85.accu-chek-reader
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: accu-chek-reader
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-data
  - --filesystem=xdg-config
modules:
  - name: accu-chek-reader
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - mkdir -p /app/bin
      - printf '#!/usr/bin/env bash\nexec python3 -m src.cli "$@"\n' > /app/bin/accu-chek-reader
      - chmod +x /app/bin/accu-chek-reader
    sources:
      - type: git
        url: https://github.com/henriquegouveia85/accu-chek-active-linux.git
        commit: bbee0556abe017d02b05728c471a8118414800e9
